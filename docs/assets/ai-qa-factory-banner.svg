<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">AI QA Factory</title>
  <desc id="description">A dark technical banner with a shield, test checkmark, circuit paths, and factory details. Generate. Detect. Repair. Approve.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#16122d"/>
    </linearGradient>
    <linearGradient id="edge" x1="80" y1="20" x2="1120" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.72"/>
      <stop offset="0.52" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.66"/>
    </linearGradient>
    <linearGradient id="shield" x1="114" y1="82" x2="286" y2="284" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="check" x1="158" y1="163" x2="246" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(205 181) rotate(25) scale(260 210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891b2" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="url(#edge)" stroke-opacity="0.68"/>
  <rect x="2" y="2" width="1196" height="356" rx="26" fill="url(#grid)"/>
  <ellipse cx="205" cy="181" rx="285" ry="225" fill="url(#glow)"/>
  <circle cx="1084" cy="58" r="108" fill="#7c3aed" fill-opacity="0.08" filter="url(#soft-glow)"/>

  <!-- Circuit paths connect the protected test core to a compact factory line. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72 116H106L126 136" stroke="#22d3ee" stroke-opacity="0.56" stroke-width="2"/>
    <path d="M74 244H108L132 220" stroke="#3b82f6" stroke-opacity="0.52" stroke-width="2"/>
    <path d="M273 116H303L323 96H351" stroke="#60a5fa" stroke-opacity="0.46" stroke-width="2"/>
    <path d="M275 241H311L331 261H367" stroke="#a78bfa" stroke-opacity="0.48" stroke-width="2"/>
    <path d="M314 180H348" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="2"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="70" cy="116" r="4"/>
    <circle cx="72" cy="244" r="4" fill="#60a5fa"/>
    <circle cx="351" cy="96" r="4" fill="#60a5fa"/>
    <circle cx="367" cy="261" r="4" fill="#a78bfa"/>
    <circle cx="348" cy="180" r="3"/>
  </g>

  <!-- Original shield and QA check symbol. -->
  <path d="M200 66L281 96V163C281 222 248 269 200 292C152 269 119 222 119 163V96L200 66Z" fill="#081426" stroke="url(#shield)" stroke-width="5"/>
  <path d="M200 85L261 108V162C261 206 238 244 200 265C162 244 139 206 139 162V108L200 85Z" fill="#0d213a" stroke="#67e8f9" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M159 180L188 208L243 151" fill="none" stroke="url(#check)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="117" r="5" fill="#22d3ee"/>
  <path d="M181 117H157M219 117H243M200 112V98" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

  <!-- Factory rhythm: three stations and a shared processing rail. -->
  <g transform="translate(912 246)" fill="none" stroke-linejoin="round">
    <path d="M0 29V8L22 18V8L44 18V0H57V29" stroke="#93c5fd" stroke-opacity="0.52" stroke-width="2"/>
    <path d="M66 29V12H82V29M91 29V5H107V29M116 29V15H132V29" stroke="#a78bfa" stroke-opacity="0.52" stroke-width="2"/>
    <path d="M-8 30H141" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="12" cy="37" r="3" fill="#22d3ee" stroke="none"/>
    <circle cx="47" cy="37" r="3" fill="#60a5fa" stroke="none"/>
    <circle cx="82" cy="37" r="3" fill="#818cf8" stroke="none"/>
    <circle cx="117" cy="37" r="3" fill="#a78bfa" stroke="none"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="386" y="146" fill="#f8fafc" font-size="58" font-weight="750" letter-spacing="-1.5">AI QA Factory</text>
    <text x="390" y="193" fill="#67e8f9" font-size="24" font-weight="650" letter-spacing="1.6">Generate. Detect. Repair. Approve.</text>
    <text x="390" y="233" fill="#cbd5e1" font-size="18" font-weight="400">Human-in-the-loop Playwright testing with AI-assisted self-healing</text>
    <g transform="translate(1031 78)">
      <rect width="92" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.58"/>
      <circle cx="20" cy="18" r="4" fill="#67e8f9"/>
      <text x="34" y="24" fill="#ddd6fe" font-size="15" font-weight="650">v1.0.1</text>
    </g>
  </g>
</svg>
