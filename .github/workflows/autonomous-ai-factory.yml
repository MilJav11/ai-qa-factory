name: Autonomous AI QA Factory
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Umožní ti spustiť generovanie manuálne na GitHube

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & Playwright
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt

      - name: AI GENERATION & EXECUTION LOOP
        run: |
          # Prečítame scenarios.csv (preskočíme hlavičku) a pre každú URL spustíme AI
          tail -n +2 scenarios.csv | while IFS=, read -r url scenario
          do
            echo "🚀 AI Generuje test pre: $url so zadaním: $scenario"
            python playwright-generator.py "$url" "$scenario"
          done

      - name: Run ALL generated tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-qa-factory-report
          path: playwright-report/
